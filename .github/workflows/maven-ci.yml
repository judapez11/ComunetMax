name: Integracion Continua - ComunetMax

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ms-config-server
          - ms-gateway
          - ms-usuarios
          - ms-planes
          - ms-cobertura
          - ms-contacto

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validar compilación de ${{ matrix.service }}
        run: |
          echo "Compilando ${{ matrix.service }}..."
          cd Microservicios/${{ matrix.service }}
          mvn clean compile -DskipTests
