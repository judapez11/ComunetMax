services:
  # -----------------------------------------------------------------
  # 1. BASE DE DATOS
  # -----------------------------------------------------------------
  db-main:
    container_name: comunet-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - comunet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s


  # -----------------------------------------------------------------
  # 2. PGADMIN (Perfil opcional: solo arranca con --profile tools up)
  # -----------------------------------------------------------------
  pgadmin:
    container_name: comunet-pgadmin
    image: dpage/pgadmin4
    restart: always
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@comunet.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - comunet-network

  # -----------------------------------------------------------------
  # 3. MICROSERVICIOS (Optimizados con límites de memoria JVM)
  # -----------------------------------------------------------------

  # --- MS USUARIOS ---
  ms-usuarios:
    build: ./Microservicios/ms-usuarios
    container_name: comunet-usuarios
    restart: always
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://comunet-postgres:5432/comunet_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET:-MiClaveSecretaQueNadieDebeSaber12345678}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - comunet-network

  # --- MS PLANES ---
  ms-planes:
    build: ./Microservicios/ms-planes
    container_name: comunet-planes
    restart: always
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://comunet-postgres:5432/comunet_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - comunet-network

  # --- MS CONTACTO ---
  ms-contacto:
    build: ./Microservicios/ms-contacto
    container_name: comunet-contacto
    restart: always
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -XX:+UseSerialGC
      - SPRING_CONFIG_IMPORT=optional:configserver:http://ms-config-server:8888
      - SPRING_APPLICATION_NAME=ms-contacto
      - SPRING_MAIL_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SMTP_PORT:-587}
      - SPRING_MAIL_USERNAME=${SMTP_USER:-PONER_AQUI_CORREO_EMPRESARIAL}
      - SPRING_MAIL_PASSWORD=${SMTP_PASS:-PONER_AQUI_APP_PASSWORD}
      - EMAIL_TO=${EMAIL_TO:-perez@gmail.com}
      - EMAIL_TO_CONTACTO=${EMAIL_TO_CONTACTO:-contacto@comunetmax.com}
      - EMAIL_TO_PLANES=${EMAIL_TO_PLANES:-ventas@comunetmax.com}
      - EMAIL_TO_PQR=${EMAIL_TO_PQR:-pqr@comunetmax.com}
    depends_on:
      ms-config-server:
        condition: service_healthy
    networks:
      - comunet-network

  # --- MS COBERTURA ---
  ms-cobertura:
    build: ./Microservicios/ms-cobertura
    container_name: comunet-cobertura
    restart: always
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://comunet-postgres:5432/comunet_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - comunet-network

  # --- CONFIG SERVER ---
  ms-config-server:
    build: ./Microservicios/ms-config-server
    container_name: comunet-config-server
    restart: always
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+UseSerialGC
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config/
    volumes:
      - ./Microservicios/ms-config-server/src/main/resources/config:/config
    networks:
      - comunet-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --- GATEWAY ---
  ms-gateway:
    build: ./Microservicios/ms-gateway
    container_name: comunet-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx160m -XX:+UseSerialGC
      - JWT_SECRET=${JWT_SECRET:-MiClaveSecretaQueNadieDebeSaber12345678}
    depends_on:
      ms-config-server:
        condition: service_healthy
    networks:
      - comunet-network

networks:
  comunet-network:
    driver: bridge

volumes:
  postgres_data:
    name: comunetmax_postgres_data
  pgadmin_data:
    driver: local
